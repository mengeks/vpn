name: VPNConnector
options:
  bundleIdPrefix: com.yourapp
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # Xcode fills this automatically when you sign in
    CODE_SIGN_STYLE: Automatic    # Let Xcode manage provisioning profiles

# ─── Shared source files ────────────────────────────────────────────────────────

targets:

  # ── iOS App ──────────────────────────────────────────────────────────────────
  VPNConnector-iOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/Shared
        group: Shared
      - path: Sources/iOS
        group: iOS
    resources:
      - path: Resources/iOS/Info.plist
    info:
      path: Resources/iOS/Info.plist
    entitlements:
      path: Config/iOS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourapp.vpnconnector.ios
        INFOPLIST_FILE: Resources/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/iOS.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"    # iPhone + iPad
    dependencies:
      - sdk: NetworkExtension.framework

  # ── macOS App ─────────────────────────────────────────────────────────────────
  VPNConnector-macOS:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/Shared
        group: Shared
      - path: Sources/macOS
        group: macOS
    resources:
      - path: Resources/macOS/Info.plist
    info:
      path: Resources/macOS/Info.plist
    entitlements:
      path: Config/macOS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourapp.vpnconnector.macos
        INFOPLIST_FILE: Resources/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/macOS.entitlements
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    dependencies:
      - sdk: NetworkExtension.framework
